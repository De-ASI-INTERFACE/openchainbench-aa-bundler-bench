name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v -o bin/aa-bundler-performance ./...

      - name: Test
        run: go test -v ./...

      - name: Verify binary
        run: |
          if [ ! -f bin/aa-bundler-performance ]; then
            echo "Binary not generated"
            exit 1
          fi
          file bin/aa-bundler-performance
