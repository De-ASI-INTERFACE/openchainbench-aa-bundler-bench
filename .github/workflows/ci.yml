name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            bin
          key: ${{ runner.os }}-bin-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-bin-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v -o bin/aa-bundler-performance ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Verify binary
        run: |
          if [ ! -f bin/aa-bundler-performance ]; then
            echo "Binary not generated"
            exit 1
          fi
          file bin/aa-bundler-performance
          echo "Binary generated successfully"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
